<dialog class="modal" id="confirm-dialog">
  <div class="modal-head"><h2 id="confirm-title">Are you sure?</h2><button class="btn ghost sm icon-only" data-close aria-label="Close"><svg class="icon sm"><use href="#i-x"/></svg></button></div>
  <div class="modal-body"><p id="confirm-text" style="color:var(--text-2)"></p></div>
  <div class="modal-foot"><button class="btn outline" data-close>Cancel</button><button class="btn dark" id="confirm-ok">Confirm</button></div>
</dialog>
<dialog class="modal wide" id="lightbox">
  <div class="modal-head"><h3 id="lightbox-title" class="ellipsis"></h3><button class="btn ghost sm icon-only" data-close aria-label="Close"><svg class="icon sm"><use href="#i-x"/></svg></button></div>
  <div class="modal-body"><img class="lightbox-img" alt=""></div>
</dialog>
