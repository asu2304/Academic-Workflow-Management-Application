<dialog class="modal" id="confirm-dialog">
  <div class="modal-head"><h2 id="confirm-title">Are you sure?</h2><button class="btn quiet sm icon-only" data-close aria-label="Close"><svg class="icon sm"><use href="#i-x"/></svg></button></div>
  <div class="modal-body"><p id="confirm-text" class="muted"></p></div>
  <div class="modal-foot"><button class="btn secondary" data-close>Cancel</button><button class="btn" id="confirm-ok">Confirm</button></div>
</dialog>
<dialog class="modal wide" id="lightbox">
  <div class="modal-head"><h2 id="lightbox-title" class="ellipsis"></h2><button class="btn quiet sm icon-only" data-close aria-label="Close"><svg class="icon sm"><use href="#i-x"/></svg></button></div>
  <div class="modal-body"><img class="lightbox-img" alt=""></div>
</dialog>
